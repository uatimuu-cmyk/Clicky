
name: Build Clicky for Windows

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PySide6 pynput

      - name: Build Clicky
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Clicky --icon assets/clicky-icon.ico autoclicker.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Clicky-Windows
          path: dist/Clicky.exe
