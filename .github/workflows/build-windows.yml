
name: Build Clicky for Windows

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PySide6 pynput

      - name: Build Clicky
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Clicky --icon assets/clicky-icon.ico autoclicker.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clicky-Windows
          path: dist/Clicky.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Clicky ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/Clicky.exe
